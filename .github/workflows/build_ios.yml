name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (IPA / App)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter doctor -v

      - name: Install Dependencies
        run: |
          if [ -d "start_up" ]; then cd start_up; fi
          flutter pub get

      - name: Build iOS Release (Unsigned)
        run: |
          if [ -d "start_up" ]; then cd start_up; fi
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          if [ -d "start_up" ]; then cd start_up; fi
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r start_up_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: |
            start_up_unsigned.ipa
            start_up/start_up_unsigned.ipa
          retention-days: 14
